<!--
  Muse setup over Bluetooth LE (Web Bluetooth).

  1. On Muse: open the button menu > Bluetooth setup and scan the QR code.
  2. Serve this folder and open it in Chrome (desktop or Android):
       cd tools && python3 -m http.server 8000   ->  http://localhost:8000/ble_setup.html
     Web Bluetooth needs https or localhost. iOS Safari lacks Web Bluetooth;
     use the Bluefy browser there.
  3. Connect, then enter the 6-digit code Muse shows when your OS asks to pair.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse setup</title>
<style>
  :root { --bg:#0b0816; --card:#1a1530; --accent:#a77dff; --text:#f2efff; --dim:#8b84a8; --ok:#6ff0bf; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
  p.dim, .dim { color:var(--dim); font-size:14px; }
  section { background:var(--card); border-radius:18px; padding:16px; margin:16px 0; }
  label { display:block; font-size:14px; color:var(--dim); margin:10px 0 4px; }
  input[type=text], input[type=password], select {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #3a3358;
    background:#120e22; color:var(--text); font-size:16px;
  }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button {
    background:var(--accent); color:#140f22; border:0; border-radius:12px; padding:10px 16px;
    font-size:16px; font-weight:600; margin:12px 8px 0 0; cursor:pointer;
  }
  button.secondary { background:#2e2552; color:var(--text); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; justify-content:space-between; gap:12px; }
  .wifi-row { display:flex; align-items:center; gap:8px; }
  .wifi-row select { flex:1; min-width:0; }
  .wifi-row button { flex:none; margin:0; padding:10px 12px; }
  .hidden { display:none !important; }
  #log { font:13px/1.5 ui-monospace, monospace; white-space:pre-wrap; color:var(--dim); max-height:180px; overflow:auto; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  fieldset { border:0; padding:0; margin:0; }
</style>
</head>
<body>
<main>
  <h1>Muse setup</h1>
  <p class="dim">Open <b>Bluetooth setup</b> on Muse, then connect.
     When asked to pair, type the code shown on Muse's screen.</p>

  <section>
    <div class="row"><h2 style="margin:0">Device</h2><span id="conn" class="dim">Not connected</span></div>
    <button id="connect">Connect</button>
    <button id="disconnect" class="secondary" disabled>Disconnect</button>
    <div id="status" class="dim" style="margin-top:12px"></div>
  </section>

  <fieldset id="controls" disabled>
    <section>
      <h2>Wi-Fi</h2>
      <label for="ssid-list">Network</label>
      <div class="wifi-row">
        <select id="ssid-list"><option value="">Connect and scan for networks</option></select>
        <button id="wifi-scan" class="secondary" type="button">Scan</button>
      </div>
      <div id="wifi-scan-state" class="dim" style="margin-top:6px"></div>
      <input id="ssid" class="hidden" type="text" autocomplete="off" maxlength="32"
             placeholder="Hidden network name" style="margin-top:8px">
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="off" maxlength="64">
      <button id="wifi-join">Join</button>
      <button id="wifi-forget" class="secondary">Forget all networks</button>
    </section>

    <section>
      <h2>Gemini</h2>
      <label for="token">Gemini API key <span class="dim">(leave empty to keep the current one)</span></label>
      <input id="token" type="password" autocomplete="off" maxlength="1023">
      <button id="hatch-save">Save</button>
      <button id="hatch-test" class="secondary">Test connection</button>
    </section>

    <section>
      <h2>Sound &amp; sleep</h2>
      <label>Volume <span id="volume-v"></span></label>
      <input id="volume" type="range" min="0" max="100">
      <label><input id="speaker" type="checkbox"> Speaker <span class="dim">(off: replies are shown, not played)</span></label>
      <label>Mic gain <span id="mic-v"></span></label>
      <input id="mic" type="range" min="0" max="36" step="3">
      <label>Brightness <span id="bright-v"></span></label>
      <input id="bright" type="range" min="10" max="100">
      <label for="sleep">Auto-sleep</label>
      <select id="sleep">
        <option value="0">Never</option><option value="30">30 seconds</option><option value="60">1 minute</option>
        <option value="120">2 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option>
      </select>
    </section>
  </fieldset>

  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const SVC    = '4d757365-0001-4000-8000-6a6f6c6c7900';
const CMD    = '4d757365-0002-4000-8000-6a6f6c6c7900';
const STATUS = '4d757365-0003-4000-8000-6a6f6c6c7900';
const NETWORKS = '4d757365-0004-4000-8000-6a6f6c6c7900';
const TOKEN_CHUNK = 180;   // stays well under the 512-byte attribute limit

const $ = id => document.getElementById(id);
let device, cmdChar, statusChar, networksChar;
let scanRunning = false;

// Web Bluetooth allows only one GATT operation at a time, so every read and
// write goes through this single queue.
let gattQueue = Promise.resolve();
function gatt(fn) {
  const run = gattQueue.then(fn);
  gattQueue = run.catch(() => {});   // one failure must not block the queue
  return run;
}

function log(msg, cls) {
  const line = document.createElement('div');
  line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  if (cls) line.className = cls;
  $('log').prepend(line);
}

function send(cmd, value = '') {
  return gatt(() => cmdChar.writeValueWithResponse(new TextEncoder().encode(`${cmd}=${value}`)))
    .catch(e => log(`${cmd} failed: ${e.message}`, 'bad'));
}

async function refresh() {
  const v = await gatt(() => statusChar.readValue());
  const s = JSON.parse(new TextDecoder().decode(v));
  const w = s.wifi, h = s.gemini;
  $('conn').textContent = `${s.name} · fw ${s.fw}`;
  $('status').innerHTML =
    `Wi-Fi: <b>${w.on ? esc(w.state) : 'off'}</b>${w.ssid ? ` (${esc(w.ssid)}${w.ip ? `, ${esc(w.ip)}` : ''})` : ''}<br>` +
    `Gemini: <b>${esc(h.state)}</b> · API key ${h.key ? 'set' : 'not set'}<br>` +
    (s.battery >= 0 ? `Battery ${s.battery}%` : 'Battery: n/a');
  if (document.activeElement !== $('ssid') && !$('ssid').value) $('ssid').value = w.ssid || '';
  setRange('volume', s.volume, v => `${v}%`);
  if (document.activeElement !== $('speaker')) $('speaker').checked = s.speaker;
  setRange('mic', s.mic_gain, v => `${v} dB`);
  setRange('bright', s.brightness, v => `${v}%`);
  if (document.activeElement !== $('sleep')) $('sleep').value = String(s.sleep);
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function readNetworks() {
  const v = await gatt(() => networksChar.readValue());
  return JSON.parse(new TextDecoder().decode(v));
}

function signal(rssi) {
  if (rssi >= -55) return '▂▄▆█';
  if (rssi >= -67) return '▂▄▆';
  if (rssi >= -75) return '▂▄';
  return '▂';
}

function showNetworks(data) {
  const list = $('ssid-list');
  const previous = list.value || $('ssid').value;
  list.replaceChildren();
  const prompt = document.createElement('option');
  prompt.value = '';
  prompt.textContent = data.aps.length ? 'Choose a Wi-Fi network' : 'No networks found';
  list.append(prompt);
  for (const [ssid, rssi, secure] of data.aps) {
    const option = document.createElement('option');
    option.value = ssid;
    option.textContent = `${ssid}   ${signal(rssi)}${secure ? '  🔒' : '  Open'}`;
    list.append(option);
  }
  const manual = document.createElement('option');
  manual.value = '__manual__';
  manual.textContent = 'Other / hidden network…';
  list.append(manual);

  const match = [...list.options].some(option => option.value === previous);
  if (match && previous) {
    list.value = previous;
  } else if (previous) {
    list.value = '__manual__';
    $('ssid').value = previous;
  }
  const manualSelected = list.value === '__manual__';
  $('ssid').classList.toggle('hidden', !manualSelected);
  $('wifi-scan-state').textContent = `${data.aps.length} network${data.aps.length === 1 ? '' : 's'} found`;
}

async function scanWifi() {
  if (scanRunning || !networksChar) return;
  scanRunning = true;
  $('wifi-scan').disabled = true;
  $('wifi-scan').textContent = 'Scanning…';
  $('wifi-scan-state').textContent = 'Looking for nearby Wi-Fi networks…';
  try {
    const before = await readNetworks();
    await send('wifi.scan');
    const deadline = Date.now() + 15000;
    let data = before;
    do {
      await sleep(500);
      data = await readNetworks();
      if (!data.scanning && data.gen !== before.gen) {
        showNetworks(data);
        log(`Found ${data.aps.length} Wi-Fi networks`, 'ok');
        return;
      }
    } while (Date.now() < deadline && device?.gatt.connected);
    throw new Error('Wi-Fi scan timed out');
  } catch (e) {
    $('wifi-scan-state').textContent = e.message;
    log(e.message, 'bad');
  } finally {
    scanRunning = false;
    $('wifi-scan').disabled = false;
    $('wifi-scan').textContent = 'Scan';
  }
}

function setRange(id, v, fmt) {
  if (document.activeElement !== $(id)) $(id).value = v;
  $(`${id}-v`).textContent = fmt($(id).value);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`); }

async function connect() {
  device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'MuseGadget-' }, { namePrefix: 'HomeLink-' }, { namePrefix: 'Muse-' }], optionalServices: [SVC] });
  device.addEventListener('gattserverdisconnected', () => {
    log('Disconnected');
    $('conn').textContent = 'Not connected';
    $('controls').disabled = true;
    $('connect').disabled = false;
    $('disconnect').disabled = true;
    networksChar = undefined;
    gattQueue = Promise.resolve();
    scanRunning = false;
  });
  log(`Connecting to ${device.name}…`);
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SVC);
  cmdChar = await svc.getCharacteristic(CMD);
  statusChar = await svc.getCharacteristic(STATUS);
  try {
    networksChar = await svc.getCharacteristic(NETWORKS);
  } catch (e) {
    networksChar = undefined;
    log('Wi-Fi scan service is not visible. Remove this device from Bluetooth settings, then pair again.', 'bad');
  }
  // The first protected read triggers pairing: enter the code shown on Muse.
  log('Pairing: enter the code shown on Muse if asked');
  await refresh();
  log('Connected', 'ok');
  $('controls').disabled = false;
  $('connect').disabled = true;
  $('disconnect').disabled = false;
  /* Some Android Web Bluetooth implementations complete authenticated reads
     but reject the CCCD write used for notifications. Polling already keeps
     the page current, so notifications are an optional improvement. */
  try {
    await gatt(() => statusChar.startNotifications());
    statusChar.addEventListener('characteristicvaluechanged', e => {
      const msg = new TextDecoder().decode(e.target.value);
      log(msg, msg.includes('error') ? 'bad' : 'ok');
      refresh().catch(() => {});
    });
  } catch (e) {
    log('Live notifications unavailable; using polling instead');
  }
  if (networksChar) scanWifi();
}

$('connect').onclick = () => {
  if (!navigator.bluetooth) { log('This browser has no Web Bluetooth. Use Chrome (or Bluefy on iOS).', 'bad'); return; }
  connect().catch(e => log(e.message, 'bad'));
};
$('disconnect').onclick = () => device?.gatt.disconnect();
$('wifi-scan').onclick = () => scanWifi();
$('ssid-list').onchange = () => {
  const manual = $('ssid-list').value === '__manual__';
  $('ssid').classList.toggle('hidden', !manual);
  if (manual) $('ssid').focus();
};

$('wifi-join').onclick = async () => {
  const selected = $('ssid-list').value;
  const ssid = selected === '__manual__' ? $('ssid').value.trim() : selected;
  if (!ssid) { log('Choose a network', 'bad'); return; }
  send('wifi.ssid', ssid);
  send('wifi.pass', $('pass').value);   // always sent, so an open network clears the old password
  await send('wifi.connect');
  $('pass').value = '';
};
$('wifi-forget').onclick = () => {
  $('ssid').value = '';
  $('ssid-list').value = '';
  $('ssid').classList.add('hidden');
  send('wifi.forget');
};

$('hatch-save').onclick = async () => {
  const token = $('token').value.trim();
  const jobs = [];
  for (let i = 0; i < token.length; i += TOKEN_CHUNK) {
    jobs.push(send(i ? 'gemini.key+' : 'gemini.key', token.slice(i, i + TOKEN_CHUNK)));
  }
  await Promise.all(jobs);
  $('token').value = '';
};
$('hatch-test').onclick = () => send('gemini.test');

for (const [id, cmd, fmt] of [['volume', 'volume', v => `${v}%`], ['mic', 'mic_gain', v => `${v} dB`],
                              ['bright', 'brightness', v => `${v}%`]]) {
  $(id).oninput = () => { $(`${id}-v`).textContent = fmt($(id).value); };
  $(id).onchange = () => send(cmd, $(id).value);
}
$('speaker').onchange = () => send('speaker', $('speaker').checked ? 1 : 0);
$('sleep').onchange = () => send('sleep', $('sleep').value);

// Keep Wi-Fi/Gemini state fresh while connected (skipped during a Wi-Fi scan).
setInterval(() => {
  if (device?.gatt.connected && !$('controls').disabled && !scanRunning) refresh().catch(() => {});
}, 3000);
</script>
</body>
</html>
